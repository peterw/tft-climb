name: Rebuild from live data
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (UTC)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rebuild
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch live TFT data
        run: node scripts/fetch.mjs
      - name: Render site
        run: node scripts/render.mjs
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          user_name: TFT Climb Bot
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Rebuild from live data"
